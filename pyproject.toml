[project]
name = "amc-commander"
version = "0.9.0"
description = "AMC (Agent MCP Commander): let AI agents (Claude, Codex, ChatGPT, any MCP client) safely use your machines through a self-hosted relay."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
authors = [{ name = "AMC contributors" }]
keywords = ["mcp", "model-context-protocol", "remote", "claude", "codex", "chatgpt", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.30,<2",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "websockets>=14,<18",
    "httpx>=0.27",
]

[project.scripts]
amc = "amc.cli:main"

[project.urls]
Homepage = "https://github.com/inflow-digital/amc"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  release-check:
    name: release check + installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate scans the full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public release gate (no denylist in CI)
        run: python scripts/release_check.py
      - name: install.sh syntax
        run: sh -n installers/install.sh
      - name: install.sh shellcheck
        run: shellcheck -s sh installers/install.sh

  package:
    name: build + smoke install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: uv build
      - name: Install the wheel as a tool
        shell: bash
        run: |
          uv tool install --python 3.12 dist/*.whl
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Smoke test
        run: |
          amc --version
          amc --help
